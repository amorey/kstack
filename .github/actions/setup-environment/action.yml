name: 'Setup Environment'
description: 'Sets up Node.js, PNPM, Go, and Rust conditionally for building Kstack'

outputs:
  go-cache-key:
    description: 'The Go cache this run saves, when it saves one'
    value: ${{ steps.go-cache-paths.outputs.key }}
  go-cache-path:
    description: 'The directories the Go cache holds'
    value: ${{ steps.go-cache-paths.outputs.path }}

inputs:
  github-token:
    description: 'GitHub token'
    required: false
    default: ''
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.26.8'
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '24'
  setup-rust:
    description: 'Whether to set up Rust'
    required: false
    default: 'false'
  setup-protoc:
    description: 'Whether to set up Protoc'
    required: false
    default: 'false'
  setup-go:
    description: 'Whether to set up Go'
    required: false
    default: 'false'
  setup-node:
    description: 'Whether to set up Node.js and PNPM'
    required: false
    default: 'false'
  setup-sandbox:
    description: 'Whether to set up the sandbox and require its tests'
    required: false
    default: 'false'
  go-cache-key:
    description: 'Names the Go cache; empty turns it off'
    required: false
    default: ''
  rust-cache-key:
    description: 'Names the Rust cache; empty turns it off'
    required: false
    default: ''
  cache-save:
    description: 'Whether to save the Rust cache, which happens on main alone'
    required: false
    default: 'true'
  go-cache-rebuild:
    description: 'Whether to expire the cached Go test results, so every test runs and the job saves the cache anew'
    required: false
    default: 'false'
  kubectl-version:
    description: 'kubectl version the sandbox tests run'
    required: false
    default: 'v1.37.0'

runs:
  using: "composite"
  steps:
    - name: Set up git authentication for GitHub requests in Rust environment
      if: inputs.setup-rust == 'true' && inputs.github-token != ''
      shell: bash
      run: |
        git config --global url."https://${{ inputs.github-token }}:@github.com/".insteadOf "https://github.com/"

    - name: Set up Protoc
      if: inputs.setup-protoc == 'true'
      uses: arduino/setup-protoc@v3

    - name: Install Tauri Linux system dependencies
      if: inputs.setup-rust == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev

    - name: Read pinned Rust toolchain
      if: inputs.setup-rust == 'true'
      id: rust-toolchain
      shell: bash
      run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

    # `@master` is the ref that accepts an explicit toolchain; `components`
    # mirrors rust-toolchain.toml, which is the pin devs get.
    - name: Set up Rust
      if: inputs.setup-rust == 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: rustfmt, clippy

    # Saved on main alone, which every PR can read; a PR saving its own copy
    # pushes the repo past its cache limit.
    - name: Set up Rust cache
      if: inputs.setup-rust == 'true' && inputs.rust-cache-key != ''
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./src-tauri"
        shared-key: ${{ inputs.rust-cache-key }}
        save-if: ${{ inputs.cache-save == 'true' && github.ref == 'refs/heads/main' }}
        cache-bin: false

    - name: Set up PNPM
      if: inputs.setup-node == 'true'
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Set up Go
      if: inputs.setup-go == 'true'
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    # One Go cache per job and runner, named after the run that saved it. GOCACHE
    # is content-addressed, so a cache from before a go.sum change is still
    # right, just partly unused. The prefix ends in `-run-` because one runner's
    # name can start another's (ubuntu-24.04, ubuntu-24.04-arm).
    - name: Find Go cache paths
      if: inputs.setup-go == 'true' && inputs.go-cache-key != ''
      id: go-cache-paths
      shell: bash
      env:
        PREFIX: go-${{ inputs.go-version }}-${{ inputs.go-cache-key }}-run-
      run: |
        {
          echo "prefix=$PREFIX"
          echo "key=$PREFIX$GITHUB_RUN_ID"
          echo "path<<EOF"
          go env GOMODCACHE GOCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # The key is this run's own, which never exists, so the prefix finds the
    # newest cache.
    - name: Restore Go cache
      if: inputs.setup-go == 'true' && inputs.go-cache-key != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache-paths.outputs.path }}
        key: ${{ steps.go-cache-paths.outputs.key }}
        restore-keys: ${{ steps.go-cache-paths.outputs.prefix }}

    # Expires every recorded test result but keeps the compiled packages, so
    # every test runs on a warm build. Results recorded after this stay valid,
    # so a PR restoring the saved cache replays them.
    - name: Expire cached Go test results
      if: >-
        inputs.setup-go == 'true' && inputs.go-cache-key != ''
        && inputs.go-cache-rebuild == 'true'
      shell: bash
      run: go clean -testcache

    # bubblewrap and passt (pasta, a run's internet) for the sandbox's tests,
    # which fail rather than skip under KSTACK_REQUIRE_SANDBOX, and iproute2,
    # which a resolver test sets up a namespace with; AppArmor restricts
    # unprivileged user namespaces on 24.04 by default.
    - name: Set up the sandbox
      if: inputs.setup-sandbox == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap passt iproute2
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        echo KSTACK_REQUIRE_SANDBOX=1 >> "$GITHUB_ENV"

    # macOS ships Seatbelt, so its sandbox tests need nothing installed.
    - name: Require the sandbox
      if: inputs.setup-sandbox == 'true' && runner.os == 'macOS'
      shell: bash
      run: echo KSTACK_REQUIRE_SANDBOX=1 >> "$GITHUB_ENV"

    # The app's end-to-end tests run kubectl and jq in the sandbox and fail
    # without them under KSTACK_REQUIRE_SANDBOX, so they are installed here
    # rather than taken from the runner image. kubectl goes to ~/.local/bin,
    # since a sandboxed run reads Kstack's toolchain folders, never PATH.
    - name: Install kubectl and jq
      if: inputs.setup-sandbox == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
      run: |
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          arm64 | aarch64) arch=arm64 ;;
        esac
        url="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/${os}/${arch}/kubectl"
        dir="$HOME/.local/bin"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/kubectl" "$url"
        echo "$(curl -fsSL "$url.sha256")  $dir/kubectl" | shasum -a 256 --check
        chmod +x "$dir/kubectl"
        echo "$dir" >> "$GITHUB_PATH"
        if [ "$os" = linux ]; then
          sudo apt-get install -y jq
        else
          brew install jq
        fi
